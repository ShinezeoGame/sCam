name: scam
description: "sCam — un vieux téléphone devient caméra de surveillance ou babyphone"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Image et son en direct, à faible latence, sur Android et Windows (WebRTC).
  flutter_webrtc: ^1.6.3
  # Appairage (X25519), preuves (HMAC-SHA-256) et chiffrement des messages (AES-GCM).
  cryptography: ^2.9.0
  shared_preferences: ^2.5.6
  image: ^4.13.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit_300Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit_600SemiBold.ttf
          weight: 600
